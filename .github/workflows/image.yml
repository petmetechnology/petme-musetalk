# Builds the 精确口型 worker image and pushes it to GHCR (ghcr.io/<owner>/petme-musetalk:latest). Lives at
# .github/workflows/image.yml of the public image repo that worker/push_image_repo.sh creates.
name: image
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the image is ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: name
        run: echo "img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/petme-musetalk" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.img }}:latest,${{ steps.name.outputs.img }}:${{ github.sha }}
